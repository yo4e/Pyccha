[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyccha"
version = "0.0.1"
description = "An experimental Kitakyushu-dialect programming language that transpiles to Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["lark>=1.2,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pyccha = "pyccha.cli:main"

[tool.setuptools.package-data]
pyccha = ["grammar.lark"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
